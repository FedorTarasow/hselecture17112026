<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CatBoost с нуля</title>
  <style>/* ==========================================================================
   tokens.css — единственный источник цветов, шрифтов и размеров презентации.
   Владелец: архитектор. Агенты читают, но не правят. Свои цвета не заводить —
   брать переменные отсюда.

   Образ: казённая контора позднего индустриального государства. Тёмный стол,
   пожелтевшие бланки, красные и зелёные штампы, холодный свет ЭВМ. Пиксельная
   сетка: всё выравнивается по 4 px (--px), рамки 4 px, скруглений нет.
   ========================================================================== */
:root {
  /* сетка */
  --px: 4px;
  --stage-w: 1920px;
  --stage-h: 1080px;
  --hud-h: 64px;          /* верхняя панель движка */
  --foot-h: 28px;         /* нижняя полоска прогресса */
  --pad-x: 64px;          /* поля слайда слева/справа */
  --pad-top: 92px;        /* = hud + воздух */
  --pad-bottom: 48px;

  /* помещение */
  --c-void: #0d0c0b;
  --c-desk-0: #1b1815;
  --c-desk-1: #29231e;
  --c-desk-2: #3a3028;
  --c-desk-3: #4d4034;
  --c-wall: #3b3f33;
  --c-wall-2: #4f5441;
  --c-wall-3: #6a6f55;
  --c-steel: #55625f;
  --c-steel-2: #84938f;
  --c-steel-3: #b3beb8;

  /* бумага и чернила */
  --c-paper: #e7ddc2;
  --c-paper-2: #d8cba9;
  --c-paper-3: #b8a985;
  --c-paper-4: #8f8163;
  --c-paper-blue: #c5d0cb;
  --c-paper-pink: #e4c5b5;
  --c-paper-green: #cfd8b6;
  --c-ink: #25211c;
  --c-ink-2: #554b3f;
  --c-ink-3: #85775f;

  /* сигнальные цвета (штампы, статусы) */
  --c-red: #b23b2e;
  --c-red-d: #7c241b;
  --c-red-l: #db7461;
  --c-green: #557f3d;
  --c-green-d: #34572a;
  --c-green-l: #94b973;
  --c-amber: #c9982b;
  --c-amber-d: #8d6916;
  --c-amber-l: #e8ca68;
  --c-blue: #3c697c;
  --c-blue-d: #264756;
  --c-blue-l: #80aab9;

  /* ячейки PSI на бумаге (фон ячейки; текст — --c-ink) */
  --psi-ok: #a8c487;
  --psi-warn: #e8d06c;
  --psi-bad: #dc7862;
  --psi-none: #cfc3a3;

  /* экран ЭВМ */
  --c-crt-bg: #0c1611;
  --c-crt-bg-2: #13231a;
  --c-crt: #86dc96;
  --c-crt-dim: #437d55;
  --c-crt-amber: #e6b84c;
  --c-crt-red: #e5624f;
  --c-crt-blue: #7fc4d6;

  /* ряды данных на графиках: порядок использования фиксирован */
  --s-1: #3c697c;   /* основная линия / «было» */
  --s-2: #b23b2e;   /* вторая линия / «стало», тревога */
  --s-3: #c9982b;
  --s-4: #557f3d;
  --s-5: #6b5a86;
  --s-mute: #8f8163;

  /* шрифты */
  --f-pixel: "Deck Pixel", "Handjet", "Consolas", monospace;      /* заголовки, подписи, кнопки (Handjet +20 %) */
  --f-8bit: "Press Start 2P", "Deck Pixel", monospace;         /* мелкие ярлыки, штампы, счётчики */
  --f-doc: "IBM Plex Mono", "Consolas", "Courier New", monospace; /* текст документов и таблиц */
  --f-news: "Old Standard TT", "Times New Roman", serif;          /* газета */
  --f-poster: "Stalinist One", "Deck Pixel", sans-serif;       /* шапка газеты, плакат (очень редко) */
  --f-num: "Handjet", "Deck Pixel", monospace;                 /* крупные числа */

  /* кегли (в px сцены 1920×1080). Меньше --fs-tiny не опускаться. */
  --fs-hero: 96px;
  --fs-h1: 60px;
  --fs-h2: 44px;
  --fs-h3: 32px;
  --fs-lead: 28px;
  --fs-body: 24px;
  --fs-small: 20px;
  --fs-tiny: 17px;
  --fs-8bit: 14px;      /* Press Start 2P читается только так: 14 / 18 / 22 */
  --fs-8bit-l: 18px;
  --fs-8bit-xl: 22px;

  /* тени: только жёсткие, со сдвигом по сетке */
  --sh-paper: 0 4px 0 var(--c-paper-3), 8px 12px 0 rgba(0, 0, 0, .38);
  --sh-paper-low: 0 4px 0 var(--c-paper-3), 4px 8px 0 rgba(0, 0, 0, .3);
  --sh-lift: 12px 20px 0 rgba(0, 0, 0, .42);
  --sh-inset: inset 0 4px 0 rgba(0, 0, 0, .28);

  /* движение: ступенчатое, без плавных кривых */
  --ease-step: steps(6, end);
  --t-fast: 160ms;
  --t-med: 320ms;
  --t-slow: 640ms;
}

/* Анимированный титульный кадр блока: картинка на весь экран, поверх — холст эффектов 480×270 и заголовок. */
*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--c-void); }
h1, p { margin: 0; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; background: var(--c-void); }
#art, #fx { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
#art { z-index: -2; }
#fx { z-index: -1; pointer-events: none; }
/* Поле 1920×1080 масштабируется скриптом под окно и прижато к левому краю. */
#safe { position: absolute; left: 0; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 50%; transform: translateY(-50%) scale(var(--k, 1)); }
.heading { position: absolute; left: 64px; top: 150px; width: 1100px; display: flex; flex-direction: column; align-items: flex-start; }
.kicker { padding: 6px 16px; color: var(--c-ink); background: var(--c-amber-l); font: 700 34px/40px var(--f-pixel); letter-spacing: 2px; text-transform: uppercase; box-shadow: 6px 6px 0 var(--c-void); }
h1 { margin-top: 28px; color: var(--c-paper); font: 700 var(--h1, 152px)/.92 var(--f-pixel); text-shadow: 8px 8px 0 var(--c-void); text-transform: uppercase; }
h1:focus { outline: none; }
.subtitle { margin-top: 20px; max-width: 1000px; color: var(--c-amber-l); font: 700 var(--sub, 72px)/1.1 var(--f-pixel); text-shadow: 4px 4px 0 var(--c-void); text-wrap: balance; }
.intro { margin-top: 28px; width: 800px; padding: 16px 20px; background: var(--c-desk-0); color: var(--c-paper); font: 400 28px/36px var(--f-doc); box-shadow: var(--sh-lift); }
.keys { position: absolute; left: 64px; top: 976px; display: flex; gap: 16px; }
.kbd { margin: 0; padding: 8px 12px; color: var(--c-ink); background: var(--c-paper); border: 4px solid var(--c-ink); box-shadow: 4px 4px 0 var(--c-void); font: 600 24px/28px var(--f-pixel); }
button.kbd { cursor: pointer; }
button.kbd[aria-pressed="true"] { background: var(--c-amber-l); }
button.kbd:focus-visible { outline: 4px solid var(--c-amber-l); outline-offset: 4px; }

:root { --h1: 152px; --sub: 60px; }</style>

<script>window.TITLE = {"block":"title-catboost","plain":"CatBoost с нуля","effects":[{"type":"path","r":14,"stages":[[[332,38]],[[272,83],[386,82]],[[243,125],[299,125],[360,125],[418,125]]]},{"type":"twinkle","rect":[125,155,480,250],"skip":[[425,160,480,205],[405,200,450,235]],"min":170,"rate":0.06,"every":280,"dark":0.3},{"type":"lamp","cold":true,"rect":[380,190,480,270]}],"sound":"hum"};</script>
<script>(() => {
  'use strict';
  const CFG = window.TITLE;
  const W = 480, H = 270;
  const embedded = window.parent !== window;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const notify = (type, payload = {}) => { if (embedded) parent.postMessage({ type, block: CFG.block, ...payload }, location.origin); };
  const item = { id: 'title', title: CFG.plain };
  window.SiteBlock = {
    id: CFG.block, title: CFG.plain,
    sections: () => [{ ...item }], current: () => ({ ...item, index: 0, total: 1 }),
    go: id => id === 'title', next: () => false, prev: () => false,
  };

  /* --- масштаб поля заголовка --- */
  const safe = document.getElementById('safe');
  const fit = () => safe.style.setProperty('--k', Math.min(innerWidth / 1920, innerHeight / 1080).toFixed(4));
  addEventListener('resize', fit); fit();

  /* --- псевдослучайные числа с зерном: кадр одинаков при каждом открытии --- */
  let seed = 20261117;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  /* --- эффекты на холсте 480×270 --- */
  const canvas = document.getElementById('fx'), g = canvas.getContext('2d');
  const art = document.getElementById('art');
  const fx = [];
  const inRect = (x, y, r) => !r || (x >= r[0] && y >= r[1] && x < r[2] && y < r[3]);

  const make = {
    snow(o) {
      const flakes = Array.from({ length: o.count || 70 }, () => ({ x: rnd() * W | 0, y: rnd() * H | 0, s: rnd() > .75 ? 2 : 1 }));
      return { every: 160, step() { for (const f of flakes) { f.y = (f.y + f.s) % H; f.x = (f.x + (f.s === 2 ? 1 : 0)) % W; } },
        draw() { g.fillStyle = '#e7ddc2'; for (const f of flakes) if (inRect(f.x, f.y, o.rect)) g.fillRect(f.x, f.y, 1, 1); } };
    },
    rain(o) {
      const r = o.rect || [0, 0, W, H];
      const drops = Array.from({ length: o.count || 60 }, () => ({ x: r[0] + rnd() * (r[2] - r[0]) | 0, y: r[1] + rnd() * (r[3] - r[1]) | 0, s: 3 + (rnd() * 3 | 0) }));
      return { every: 60, step() { for (const d of drops) { d.y += d.s; if (d.y >= r[3]) { d.y = r[1]; d.x = r[0] + rnd() * (r[2] - r[0]) | 0; } } },
        draw() { g.fillStyle = 'rgba(170,190,215,.55)'; for (const d of drops) g.fillRect(d.x, d.y, 1, 3); } };
    },
    dust(o) {
      const r = o.rect || [0, 0, W, H];
      const motes = Array.from({ length: o.count || 40 }, () => ({ x: r[0] + rnd() * (r[2] - r[0]), y: r[1] + rnd() * (r[3] - r[1]), vx: (rnd() - .5) * .5, vy: -.1 - rnd() * .25, p: rnd() * 6 }));
      return { every: 120, step() { for (const m of motes) { m.x += m.vx; m.y += m.vy; m.p += .5; if (m.y < r[1]) m.y = r[3] - 1; if (m.x < r[0]) m.x = r[2] - 1; if (m.x >= r[2]) m.x = r[0]; } },
        draw() { for (const m of motes) { g.fillStyle = `rgba(240,215,150,${(.25 + .3 * (1 + Math.sin(m.p)) / 2).toFixed(2)})`; g.fillRect(m.x | 0, m.y | 0, 1, 1); } } };
    },
    // Мерцание огней: находит на самой картинке яркие тёплые точки (окна, лампы, индикаторы) и по очереди гасит и зажигает их.
    twinkle(o) {
      let cells = [], off = new Set();
      const scan = () => {
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(art, 0, 0, W, H);
        const d = x.getImageData(0, 0, W, H).data, size = o.cell || 2;
        for (let cy = 0; cy < H; cy += size) for (let cx = 0; cx < W; cx += size) {
          if (!inRect(cx, cy, o.rect)) continue;
          if ((o.skip || []).some(r => inRect(cx, cy, r))) continue;
          const i = (cy * W + cx) * 4, R = d[i], G = d[i + 1], B = d[i + 2];
          const warm = R > (o.min || 190) && G > (o.min || 190) * .62 && B < R * .78;
          const green = o.green && G > 150 && G > R * 1.25 && G > B * 1.25;
          if (warm || green) cells.push({ x: cx, y: cy, s: size });
        }
        const keep = o.max || 260;
        if (cells.length > keep) { for (let i = cells.length - 1; i > 0; i--) { const j = rnd() * (i + 1) | 0; [cells[i], cells[j]] = [cells[j], cells[i]]; } cells.length = keep; }
        for (let i = 0; i < cells.length * (o.dark || .2); i++) off.add(rnd() * cells.length | 0);
      };
      if (art.complete && art.naturalWidth) scan(); else art.addEventListener('load', scan, { once: true });
      return { every: o.every || 420, step() { const n = Math.max(1, cells.length * (o.rate || .03) | 0); for (let i = 0; i < n; i++) { const k = rnd() * cells.length | 0; if (off.has(k)) off.delete(k); else off.add(k); } },
        draw() { g.fillStyle = o.shade || 'rgba(18,20,30,.82)'; for (const k of off) { const c = cells[k]; if (c) g.fillRect(c.x, c.y, c.s, c.s); } } };
    },
    // Сигнал идёт по дереву: узлы вспыхивают по уровням сверху вниз.
    path(o) {
      let stage = -1, hold = 0;
      return { every: o.every || 520, step() { if (hold > 0) { hold--; stage = -1; return; } stage++; if (stage >= o.stages.length) { stage = -1; hold = o.pause || 3; } },
        draw() { if (stage < 0) return; g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = o.color || 'rgba(255,225,140,.34)';
          for (const [x, y] of o.stages[stage]) { const r = o.r || 13; for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); g.fillRect(x - w, y + dy, w * 2, 1); } } g.restore(); } };
    },
    // Лампа: едва заметное дыхание тёплого света по всему кадру.
    lamp(o) {
      let a = 0, t = 0;
      return { every: 140, step() { t += 1; a = (rnd() > .93 ? .07 : .025) * (1 + Math.sin(t / 5)) / 2; }, draw() { g.fillStyle = `rgba(${o.cold ? '120,200,160' : '255,190,90'},${a.toFixed(3)})`; const r = o.rect || [0, 0, W, H]; g.fillRect(r[0], r[1], r[2] - r[0], r[3] - r[1]); } };
    },
  };
  for (const e of CFG.effects || []) if (make[e.type]) fx.push({ ...make[e.type](e), last: 0 });
  const paint = () => { g.clearRect(0, 0, W, H); for (const e of fx) e.draw(); };
  let raf = 0;
  const loop = now => {
    let dirty = false;
    for (const e of fx) if (now - e.last >= e.every) { e.step(); e.last = now; dirty = true; }
    if (dirty) paint();
    raf = requestAnimationFrame(loop);
  };
  const start = () => { paint(); if (!reduced && !raf) raf = requestAnimationFrame(loop); };
  if (art.complete) start(); else art.addEventListener('load', start, { once: true });
  // Заголовок печатается по буквам, как на титуле блока 2.
  const intro = document.querySelector('.intro'), full = intro.textContent;
  if (!reduced) {
    const chars = Array.from(full); let n = 0; intro.textContent = ' ';
    const timer = setInterval(() => { n += 2; intro.textContent = chars.slice(0, n).join('') || ' '; if (n >= chars.length) { clearInterval(timer); intro.textContent = full; } }, 40);
  }

  /* --- звук: фон сцены синтезируется на лету, по умолчанию выключен (клавиша M) --- */
  const button = document.getElementById('sound');
  let ac = null, master = null, on = false, timers = [];
  function noiseBuffer(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function noise(type, freq, q, gain) {
    const s = ac.createBufferSource(); s.buffer = noiseBuffer(3); s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const v = ac.createGain(); v.gain.value = gain; s.connect(f); f.connect(v); v.connect(master); s.start();
    return { f, v };
  }
  function tone(freq, gain, type = 'sine') {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const v = ac.createGain(); v.gain.value = gain; o.connect(v); v.connect(master); o.start(); return { o, v };
  }
  function blip(freq, dur, gain, type = 'square') {
    const t = ac.currentTime, o = ac.createOscillator(), v = ac.createGain(); o.type = type; o.frequency.value = freq;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(gain, t + .005); v.gain.exponentialRampToValueAtTime(.0005, t + dur);
    o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  function tick(freq, dur, gain) {
    const t = ac.currentTime, s = ac.createBufferSource(); s.buffer = noiseBuffer(.2);
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 3;
    const v = ac.createGain(); v.gain.setValueAtTime(gain, t); v.gain.exponentialRampToValueAtTime(.0005, t + dur);
    s.connect(f); f.connect(v); v.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  const sometimes = (min, max, fn) => { const run = () => { if (on) fn(); timers.push(setTimeout(run, min + Math.random() * (max - min))); }; timers.push(setTimeout(run, min)); };
  const sway = (param, base, depth, period) => { const l = ac.createOscillator(), a = ac.createGain(); l.frequency.value = 1 / period; a.gain.value = depth; l.connect(a); a.connect(param); l.start(); param.value = base; };
  const scenes = {
    // машинный зал: гул трансформаторов, шум вентиляции, щелчки реле и редкие писки ЭВМ
    hum() { tone(50, .16); tone(100, .05); tone(150, .02, 'triangle'); noise('lowpass', 900, .5, .05);
      sometimes(250, 1400, () => tick(2400 + Math.random() * 1500, .03, .12)); sometimes(2500, 7000, () => { const f = 700 + Math.random() * 900; blip(f, .07, .04); setTimeout(() => on && blip(f * 1.5, .07, .04), 110); }); },
    // аудитория: тихий тон зала, стук и шорох мела по доске
    hall() { noise('lowpass', 420, .4, .06); tone(120, .012);
      sometimes(900, 3200, () => { const n = 2 + (Math.random() * 5 | 0); for (let i = 0; i < n; i++) setTimeout(() => on && tick(3200 + Math.random() * 1800, .05 + Math.random() * .08, .1), i * (90 + Math.random() * 120)); }); },
    // совещание: дождь по стеклу, редкие тяжёлые капли, тиканье часов
    rain() { const r = noise('bandpass', 2600, .6, .1); sway(r.v.gain, .1, .03, 7); noise('lowpass', 500, .5, .05);
      sometimes(400, 1500, () => tick(900 + Math.random() * 700, .06, .1)); sometimes(1000, 1000, () => tick(4200, .015, .05)); },
    // ночной город: ветер, далёкий гул, редкий телефонный звонок вдали
    wind() { const w = noise('bandpass', 420, 1.2, .14); sway(w.f.frequency, 420, 180, 9); sway(w.v.gain, .14, .06, 13); tone(62, .03);
      sometimes(9000, 20000, () => { for (let i = 0; i < 2; i++) setTimeout(() => { if (!on) return; for (let k = 0; k < 9; k++) setTimeout(() => on && blip(k % 2 ? 480 : 620, .045, .018, 'sine'), k * 50); }, i * 900); }); },
  };
  function setSound(value) {
    on = value;
    button.setAttribute('aria-pressed', String(on)); button.textContent = 'M звук: ' + (on ? 'вкл' : 'выкл'); button.title = (on ? 'Выключить' : 'Включить') + ' звук (M)';
    try {
      if (on) {
        const Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return;
        ac = new Ctor(); master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
        master.gain.linearRampToValueAtTime(CFG.volume || .5, ac.currentTime + 1.2);
        (scenes[CFG.sound] || scenes.hum)();
      } else { timers.forEach(clearTimeout); timers = []; if (ac) { ac.close(); ac = null; } }
    } catch (error) { console.error('[title] звук', error); }
  }
  button.addEventListener('click', () => { button.blur(); setSound(!on); });
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.key.toLowerCase() === 'm' || event.key.toLowerCase() === 'ь') { setSound(!on); event.preventDefault(); }
  });
  // Когда лектор ушёл с титула в блок, звук сцены замолкает.
  document.addEventListener('visibilitychange', () => { if (document.hidden && on) setSound(false); });
  if (embedded && 'IntersectionObserver' in window) new IntersectionObserver(entries => { if (!entries[0].isIntersecting && on) setSound(false); }).observe(document.documentElement);
  if (embedded) setInterval(() => { try { if (on && window.frameElement && window.frameElement.hidden) setSound(false); } catch (e) {} }, 400);
  notify('siteblock:ready');
})();
</script>
